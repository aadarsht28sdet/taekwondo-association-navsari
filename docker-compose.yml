services:
  mongo:
    image: mongo:8
    container_name: tan-mongo
    restart: unless-stopped
    ports: 
      - "27017:27017"
    volumes: 
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"] 
      interval: 10s 
      timeout: 5s 
      retries: 5 

  redis:
    image: redis:7-alpine 
    container_name: tan-redis
    restart: unless-stopped
    ports: 
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] 
      interval: 10s 
      timeout: 5s 
      retries: 5   

  api:
    build: 
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: tan-api
    ports: 
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/taekwondo_association_navsari
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      mongo: 
        condition: service_healthy
      redis: 
        condition: service_healthy

  web:
    build: 
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: tan-web
    ports: 
      - "5173:80"
    depends_on: 
      - api

volumes:
  mongo_data:
